name: Deploy ordinary MAP NAVI preview
# Deploy ordinary MAP NAVI source: basana/turret-tales-preview:map-navi/photos-popups-poi-route-20261126 (preview-only fixes; source commit e0d0a35e3dff6af230701db20ab631703e286b18).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: experimental-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the ordinary MAP NAVI build
        uses: actions/checkout@v4
        with:
          repository: basana/turret-tales-preview
          ref: fdad86b56f6cbd340cdff05cb9bee5be7ce90057
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload ordinary MAP NAVI preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Deploy ordinary MAP NAVI preview
        id: deployment
        uses: actions/deploy-pages@v4
